name: Build data and deploy site

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0"   # Mondays 03:17 AWST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Fetch previously published database (fallback for failed sources)
        run: |
          mkdir -p build
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/funding-full.sqlite.gz" \
            | gunzip > build/previous.sqlite || rm -f build/previous.sqlite
          ls -la build
      - name: Build database
        run: |
          PREV=""
          [ -s build/previous.sqlite ] && PREV="--previous build/previous.sqlite"
          python -m etl.run --out build/out $PREV 2>&1 | tee build/etl.log
      - name: Source summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("site/data/meta.json"))
          print(f"Built {m['built']}\n\n| Source | Status | Rows | Note |\n|---|---|---|---|")
          for s in m["sources"]:
              print(f"| {s['name']} | {s['status']} | {s['rows']} | {(s['note'] or '').replace('|', '/')} |")
          PY
          [ -f build/out/analysis.md ] && cat build/out/analysis.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload ETL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-diagnostics
          path: |
            build/etl.log
            build/out/samples/
      - uses: actions/configure-pages@v5
        if: github.ref_name == github.event.repository.default_branch
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch
        with:
          path: site

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
